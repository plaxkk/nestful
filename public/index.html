<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestful - 家庭协作与情感连接工具</title>
  <meta name="description" content="Nestful 是专为家庭而生的微信生态家庭协作与情感连接工具">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 2.5em;
    }
    .subtitle {
      color: #666;
      font-size: 1.2em;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .feature {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }
    .feature h3 {
      color: #667eea;
      margin-bottom: 10px;
    }
    .feature ul {
      list-style: none;
      padding-left: 0;
    }
    .feature li {
      padding: 5px 0;
      color: #555;
    }
    .feature li:before {
      content: "✓ ";
      color: #667eea;
      font-weight: bold;
      margin-right: 8px;
    }
    .cta {
      margin-top: 30px;
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .cta:hover {
      transform: scale(1.05);
    }
    .footer {
      margin-top: 30px;
      color: #999;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏡 Nestful</h1>
    <p class="subtitle">专为家庭而生的微信生态家庭协作与情感连接工具</p>
    
    <div class="feature">
      <h3>核心功能</h3>
      <ul>
        <li>家庭空间创建与成员邀请</li>
        <li>生日纪念日提醒</li>
        <li>家庭活动管理</li>
        <li>记忆墙分享</li>
        <li>健康提醒</li>
        <li>家庭账本</li>
      </ul>
    </div>
    
    <button class="cta" onclick="window.location.href='#wechat'">在微信中打开小程序</button>
    
    <div class="footer">
      <p>请在微信中搜索"Nestful"小程序</p>
    </div>
  </div>

  <!-- Vercel Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
