name: Reminder Dispatch

on:
  schedule:
    # Offset from common five-minute boundaries to reduce GitHub scheduler drops.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: reminder-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      REMINDER_DISPATCH_URL: https://nestful.kkplayit.online/v1/reminders/dispatch-due
      CRON_SECRET: ${{ secrets.NESTFUL_CRON_SECRET }}
    steps:
      - name: Dispatch due reminders
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$REMINDER_DISPATCH_URL"
          else
            curl --fail --silent --show-error "$REMINDER_DISPATCH_URL"
          fi
